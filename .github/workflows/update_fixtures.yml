name: Update Football Fixtures

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 (covers weekend & midweek match releases)
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

permissions:
  contents: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Fixtures Export
        run: python export_fixtures.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures.js csv_cache/fixtures.csv
          if git diff --staged --quiet; then
            echo "No fixture changes detected."
          else
            git commit -m "Auto-update upcoming fixtures [skip ci]"
            git push
          fi
