name: Update Match Results & Data

on:
  schedule:
    # UK Winter (GMT / UTC+0: Nov, Dec, Jan, Feb): 6:00 AM & 8:00 PM UK = 06:00 & 20:00 UTC
    - cron: "0 12,20 * 1,2,11,12 *"
    # UK Summer (BST / UTC+1: Apr, May, Jun, Jul, Aug, Sep): 6:00 AM & 8:00 PM UK = 05:00 & 19:00 UTC
    - cron: "0 11,19 * 4,5,6,7,8,9 *"
    # DST transition months (March & October): covers 6am & 8pm across both GMT/BST
    - cron: "0 11,12,19,20 * 3,10 *"
  workflow_dispatch: # Allows manual trigger from the GitHub web UI

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Data Export
        run: python export_data.py

      - name: Commit and Push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js csv_cache/
          if git diff --staged --quiet; then
            echo "No match data changes detected."
          else
            git commit -m "Auto-update match results & stats [skip ci]"
            git push
          fi
